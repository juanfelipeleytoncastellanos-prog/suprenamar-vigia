<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPRENAMAR - Portal de Autogestión de Residentes</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a1727">
<link rel="apple-touch-icon" href="/static/logo.png">
<style>
:root { --fondo:#07111f; --panel:#101f33; --borde:#263e59; --azul:#4db6ff; --texto:#edf5ff; --suave:#91a8c2; --verde:#42d6a0; --amarillo:#ffc857; --rojo:#ff5e5e; }
* { box-sizing:border-box } body { margin:0; background:var(--fondo); color:var(--texto); font-family:Segoe UI,Arial,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.panel { background:var(--panel); border:1px solid var(--borde); border-radius:14px; width:100%; max-width:520px; padding:35px; box-shadow: 0 0 40px rgba(77,182,255,0.2); }
.btn { background:#167ec5; border:1px solid #3d9fe8; color:white; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; width:100%; margin-top:20px; font-size:14px; transition:background 0.2s; }
.btn:hover { background:#126aa7; }
.formgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:10px; }
.field { margin-bottom:12px; grid-column: span 2; }
.field.half { grid-column: span 1; }
label { display:block; color:#9bb3cd; font-size:12px; margin-bottom:5px; font-weight:600; }
input,select { width:100%; padding:11px; border:1px solid #2b4560; border-radius:8px; background:#091625; color:white; font-size:13px; outline:none; }
input:focus, select:focus { border-color:var(--azul); }
</style>
</head>
<body>

<div class="panel">
    <div style="text-align:center; margin-bottom:25px;">
        <h2 style="color:var(--azul); margin:0 0 5px 0; font-size:24px;">SUPRENAMAR</h2>
        <p style="color:var(--amarillo); font-size:11px; margin:0; letter-spacing:1px; text-transform:uppercase;">Portal Autónomo de Residentes</p>
    </div>

    <form id="fResidentePortal">
        <div class="field">
            <label>Seleccionar Conjunto Residencial</label>
            <select id="pConjunto" required><option value="">Cargando conjuntos...</option></select>
        </div>

        <div class="field">
            <label>Nombre Completo</label>
            <input name="nombre" placeholder="Ej: Carlos Andrés Leyton" required>
        </div>

        <div class="field half">
            <label>Documento de Identidad</label>
            <input name="documento" placeholder="Número de cédula">
        </div>

        <div class="field half">
            <label>Placa del Vehículo (Carro / Moto)</label>
            <input name="placa" placeholder="Ej: ABC-123">
        </div>

        <div class="field half">
            <label>Torre / Bloque</label>
            <input name="torre" placeholder="Ej: Torre 2" required>
        </div>

        <div class="field half">
            <label>Apartamento</label>
            <input name="apto" placeholder="Ej: 301" required>
        </div>

        <div class="field">
            <label>Número de Puesto de Parqueadero Asignado</label>
            <input name="puesto" placeholder="Ej: Puesto 45">
        </div>

        <div class="field" style="border-top:1px solid var(--borde); padding-top:15px; margin-top:10px;">
            <label style="margin-bottom:8px;">Registro Biométrico Facial</label>
            <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                <video id="camaraResidente" autoplay playsinline style="width:130px; height:100px; background:#000; border-radius:6px; object-fit:cover; border:1px solid var(--borde);"></video>
                <canvas id="canvasResidente" style="display:none;"></canvas>
                <div style="flex:1; display:grid; gap:6px;">
                    <button type="button" class="btn" style="margin:0; padding:8px; font-size:11px; background:#142943;" onclick="capturarRostro()">Tomar Foto Facial</button>
                    <small id="estadoCaptura" style="color:var(--suave); font-size:11px;">Enfoque su rostro a la cámara.</small>
                </div>
                <div id="previewRostro" style="width:65px; height:65px; border-radius:6px; border:1px dashed var(--borde); display:flex; align-items:center; justify-content:center; color:var(--suave); font-size:9px; overflow:hidden;">Sin foto</div>
            </div>
        </div>
        <input type="hidden" name="foto_rostro" id="fotoRostroInput">

        <button type="submit" class="btn">Guardar Registro en el Sistema</button>
    </form>

    <div style="text-align:center; margin-top:20px; border-top:1px solid var(--borde); padding-top:12px;">
        <a href="/" style="color:var(--suave); font-size:11px; text-decoration:none;">← Volver al inicio de sesión de seguridad</a>
    </div>
</div>

<script>
let localStream = null;

async function cargarConjuntos() {
    try {
        const r = await fetch('/api/conjuntos');
        const conjuntos = await r.json();
        const select = document.getElementById('pConjunto');
        select.innerHTML = conjuntos.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    } catch(e) { console.error("Error cargando conjuntos"); }
}
cargarConjuntos();

async function iniciarCamara() {
    try {
        const video = document.getElementById('camaraResidente');
        localStream = await navigator.mediaDevices.getUserMedia({ video: { width: 200, height: 150 } });
        video.srcObject = localStream;
    } catch(e) {
        document.getElementById('estadoCaptura').textContent = "No se pudo activar la cámara.";
    }
}
iniciarCamara();

function capturarRostro() {
    const video = document.getElementById('camaraResidente');
    const canvas = document.getElementById('canvasResidente');
    canvas.width = 160;
    canvas.height = 120;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg');
    
    document.getElementById('fotoRostroInput').value = dataUrl;
    document.getElementById('previewRostro').innerHTML = `<img src="${dataUrl}" style="width:100%; height:100%; object-fit:cover;">`;
    document.getElementById('estadoCaptura').textContent = "¡Rostro capturado con éxito!";
}

document.getElementById('fResidentePortal').onsubmit = async (e) => {
    e.preventDefault();
    const conjunto_id = document.getElementById('pConjunto').value;
    const formData = Object.fromEntries(new FormData(e.target));
    
    try {
        const r = await fetch(`/api/residentes?conjunto_id=${conjunto_id}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(formData)
        });
        
        const textResponse = await r.text();
        let data;
        try {
            data = JSON.parse(textResponse);
        } catch (err) {
            data = { detail: textResponse };
        }

        if(!r.ok) throw new Error(data.detail || "Error al registrar los datos en el servidor.");

        alert("¡Registro exitoso! Su biometría facial, vehículo y puesto de parqueadero han quedado guardados en el sistema del conjunto.");
        e.target.reset();
        document.getElementById('fotoRostroInput').value = "";
        document.getElementById('previewRostro').innerHTML = "Sin foto";
    } catch(err) {
        alert("Error: " + err.message);
    }
};
</script>
</body>
</html>
